[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-civilization"
version = "0.1.0"
description = "Experimental platform for studying autonomous AI agents in a persistent 3D environment (Phase 0 foundation)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.0",
  "python-dotenv>=1.0,<2",
]
authors = [{ name = "AI_Civilization contributors" }]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
ai-civ = "ai_civilization.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/ai_civilization"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
src = ["backend/src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
